services:
  tricorder:
    image: ${TRICORDER_IMAGE:-tricorder-neural:latest}
    build: .
    ports:
      - "${TRICORDER_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - tricorder-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  ollama:
    image: ollama/ollama:0.1.32
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - agent
    networks:
      - tricorder-net
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}

networks:
  tricorder-net:
    driver: bridge

volumes:
  ollama-data:
