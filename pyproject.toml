[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tricorder-neural"
version = "1.0.0"
description = "Neural network-enhanced sensor fusion platform on Raspberry Pi 5"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "structlog>=24.0.0",
    "sse-starlette>=2.2.0",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
agent = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
]
hardware = [
    "smbus2>=0.4.0; sys_platform == 'linux'",
    "spidev>=3.6; sys_platform == 'linux'",
    "pyserial>=3.5",
    "RPi.GPIO>=0.7.0; sys_platform == 'linux'",
]
hailo = [
    "hailort>=4.17",
]

[project.scripts]
tricorder-mcp = "mcp_server.server:main"
tricorder-agent = "agents.langgraph_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "regression: Regression tests",
    "sanity: Sanity/smoke tests",
    "performance: Performance tests",
    "hardware: Requires real hardware (skipped in CI)",
    "slow: Tests that take > 1s",
    "smoke: Container smoke tests",
    "ollama: Requires Ollama LLM",
]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
