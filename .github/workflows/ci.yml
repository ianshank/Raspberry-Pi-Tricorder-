name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  COVERAGE_FAIL_UNDER: "85"
  TRICORDER_PORT: "8000"
  HEALTH_CHECK_MAX_RETRIES: "30"
  HEALTH_CHECK_RETRY_DELAY_S: "1"
  HEALTH_CHECK_CONNECT_TIMEOUT_S: "5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.8"
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,agent]"
      - run: make typecheck-touched

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,agent]"
      - name: Run tests with coverage
        run: >
          PYTHONPATH=src python -m pytest tests/
          --ignore=tests/hardware
          --ignore=tests/smoke
          --cov=src
          --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }}
          --cov-report=term-missing
          --cov-report=html
          -v
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker compose build
      - name: Start container
        run: docker compose up -d
      - name: Wait for health
        run: >
          bash scripts/lib/health-check.sh
          "http://localhost:${{ env.TRICORDER_PORT }}/health"
          "${{ env.HEALTH_CHECK_MAX_RETRIES }}"
          "${{ env.HEALTH_CHECK_RETRY_DELAY_S }}"
          "${{ env.HEALTH_CHECK_CONNECT_TIMEOUT_S }}"
          "Container"
      - name: Run smoke tests
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=src python -m pytest tests/smoke/ -v -m smoke --smoke-url "http://localhost:${TRICORDER_PORT}" --smoke-ws-url "ws://localhost:${TRICORDER_PORT}"
      - name: Teardown
        if: always()
        run: |
          docker compose logs || true
          docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tricorder-neural
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hardware:
    runs-on: [self-hosted, rpi5]
    continue-on-error: true
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,hardware]"
      - name: Run hardware tests
        run: >
          PYTHONPATH=src python -m pytest tests/hardware/
          -v -m hardware --tb=short --junitxml=hardware-results.xml
      - name: Upload hardware results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-test-results
          path: hardware-results.xml
