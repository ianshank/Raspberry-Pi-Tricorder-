project_name: "Tricorder Neural Platform"
version: "1.0.0"
environment: "development"

sensors:
  i2c_devices:
    bme680:
      address: 118
      bus: 1
      enabled: true
      poll_rate_hz: 1.0
      timeout_ms: 1000
    mlx90640:
      address: 51
      bus: 1
      enabled: true
      poll_rate_hz: 4.0
      timeout_ms: 2000

  spi_devices:
    ads1263:
      bus: 0
      device: 0
      max_speed_hz: 1000000
      mode: 1
      bits_per_word: 8
      cs_gpio: 8
      drdy_gpio: 17
      reset_gpio: 27
      enabled: true

  uart_devices:
    hlk_ld2410:
      port: "/dev/ttyAMA0"
      baud_rate: 115200
      timeout_s: 1.0
      enabled: true

  adc_channels:
    gas_mq2:
      positive_input: 0
      negative_input: 1
      label: "MQ-2 Smoke/LPG"
      gain: 1
      data_rate: 20

models:
  anomaly_detector:
    model_path: "models/onnx/anomaly_lstm.onnx"
    input_shape: [1, 256, 10]
    output_shape: [1, 10]
    quantization: "int8"
    batch_size: 1
    confidence_threshold: 0.75
    window_size: 256

mcp_server:
  host: "127.0.0.1"
  port: 8000
  transport: "http"
  auth_enabled: false
  max_concurrent_tools: 10

agent:
  llm_endpoint: "http://localhost:11434"
  model_name: "qwen2.5:3b"
  temperature: 0.1
  max_tokens: 512
  checkpoint_db_path: "data/agent_checkpoints.db"
  mission_mode: "patrol"
  human_in_loop_threshold: "HIGH"

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
  max_bytes: 10485760
  backup_count: 0
